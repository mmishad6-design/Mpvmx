name: Build and publish mpvmx APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-mpvmx.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build-mpvmx.yml'

permissions:
  contents: write

concurrency:
  group: mpvmx-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs for all Android CPU architectures
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare persistent release keystore
        if: github.event_name != 'pull_request'
        env:
          MPVMX_KEYSTORE_BASE64: ${{ secrets.MPVMX_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${MPVMX_KEYSTORE_BASE64}" ]; then
            echo "Persistent signing is not configured yet; this build will use the temporary debug key."
            exit 0
          fi
          key_path="${RUNNER_TEMP}/mpvmx-release.jks"
          printf '%s' "${MPVMX_KEYSTORE_BASE64}" | base64 --decode > "${key_path}"
          chmod 600 "${key_path}"
          echo "MPVMX_SIGNING_STORE_FILE=${key_path}" >> "${GITHUB_ENV}"

      - name: Build split and universal APKs
        env:
          MPVMX_SIGNING_STORE_FILE: ${{ runner.temp }}/mpvmx-release.jks
          MPVMX_SIGNING_STORE_PASSWORD: ${{ github.event_name == 'pull_request' && '' || secrets.MPVMX_SIGNING_STORE_PASSWORD }}
          MPVMX_SIGNING_KEY_ALIAS: ${{ github.event_name == 'pull_request' && '' || secrets.MPVMX_SIGNING_KEY_ALIAS }}
          MPVMX_SIGNING_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && '' || secrets.MPVMX_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleStandardPreview --stacktrace --no-daemon --max-workers=2

      # Rebuild the ARM64 variant with ABI splits disabled. This produces a
      # standalone ARM64-only APK while retaining the multi-ABI universal APK.
      - name: Build standalone ARM64 APK
        env:
          MPVMX_SIGNING_STORE_FILE: ${{ runner.temp }}/mpvmx-release.jks
          MPVMX_SIGNING_STORE_PASSWORD: ${{ github.event_name == 'pull_request' && '' || secrets.MPVMX_SIGNING_STORE_PASSWORD }}
          MPVMX_SIGNING_KEY_ALIAS: ${{ github.event_name == 'pull_request' && '' || secrets.MPVMX_SIGNING_KEY_ALIAS }}
          MPVMX_SIGNING_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && '' || secrets.MPVMX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out='app/build/outputs/apk/standard/preview'
          backup="${RUNNER_TEMP}/mpvmx-split-apks"
          mkdir -p "$backup"
          cp "$out"/*.apk "$backup"/
          ./gradlew assembleStandardPreview -PtargetAbi=arm64-v8a --stacktrace --no-daemon --max-workers=2
          standalone="$out/app-standard-preview.apk"
          test -s "$standalone"
          cp "$standalone" "$out/app-standard-arm64-v8a-standalone-preview.apk"
          rm "$standalone"
          # The second Gradle build cleans the APK output directory; restore
          # the original ABI-split and universal APKs alongside the standalone one.
          cp "$backup"/*.apk "$out"/

      - name: Verify APKs, signatures, and native ABI payloads
        shell: bash
        run: |
          set -euo pipefail
          out='app/build/outputs/apk/standard/preview'
          echo 'APK files generated:'
          find "$out" -maxdepth 1 -type f -name '*.apk' -printf '%f (%k KB)\n' | sort
          count="$(find "$out" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [ "$count" -lt 5 ]; then
            echo "::error::Expected 4 architecture APKs plus 1 universal APK; found $count."
            exit 1
          fi
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if ! find "$out" -maxdepth 1 -type f -name "*${abi}*.apk" | grep -q .; then
              echo "::error::Missing APK for $abi"
              exit 1
            fi
          done
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          test -x "$apksigner"
          for apk in "$out"/*.apk; do
            echo "Checking $(basename "$apk")"
            unzip -t "$apk" >/dev/null
            "$apksigner" verify --verbose "$apk" >/dev/null
          done
          arm64_apk="$(find "$out" -maxdepth 1 -type f -name '*arm64-v8a*.apk' | head -n 1)"
          universal_apk="$(find "$out" -maxdepth 1 -type f -name '*universal*.apk' | head -n 1)"
          test -n "$arm64_apk"
          test -n "$universal_apk"
          arm64_entries="$(unzip -Z1 "$arm64_apk")"
          universal_entries="$(unzip -Z1 "$universal_apk")"
          grep -Fq 'lib/arm64-v8a/' <<< "$arm64_entries"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Fq "lib/$abi/" <<< "$universal_entries" || { echo "::error::Universal APK missing $abi native libraries"; exit 1; }
          done
          echo 'APK ZIP integrity, signatures, and native ABI payloads verified.'

      - name: Upload all APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvmx-all-android-apks
          path: app/build/outputs/apk/standard/preview/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Determine release metadata
        id: release_meta
        if: github.event_name != 'pull_request'
        run: echo "commit_count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish all APKs in public GitHub pre-release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mpvmx-preview-r${{ steps.release_meta.outputs.commit_count }}-${{ github.sha }}
          name: mpvmx Preview r${{ steps.release_meta.outputs.commit_count }}
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/standard/preview/*.apk
          fail_on_unmatched_files: true
