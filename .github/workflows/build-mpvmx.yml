name: Build and publish mpvmx APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build-mpvmx.yml'

permissions:
  contents: write

concurrency:
  group: mpvmx-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs for all Android CPU architectures
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build split and universal APKs
        run: ./gradlew assembleStandardPreview --stacktrace --no-daemon --max-workers=2

      - name: Verify APKs, signatures, and native ABI payloads
        shell: bash
        run: |
          set -euo pipefail
          out='app/build/outputs/apk/standard/preview'
          echo 'APK files generated:'
          find "$out" -maxdepth 1 -type f -name '*.apk' -printf '%f (%k KB)\n' | sort
          count="$(find "$out" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [ "$count" -lt 5 ]; then
            echo "::error::Expected 4 architecture APKs plus 1 universal APK; found $count."
            exit 1
          fi
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if ! find "$out" -maxdepth 1 -type f -name "*${abi}*.apk" | grep -q .; then
              echo "::error::Missing APK for $abi"
              exit 1
            fi
          done
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          test -x "$apksigner"
          for apk in "$out"/*.apk; do
            echo "Checking $(basename "$apk")"
            unzip -t "$apk" >/dev/null
            "$apksigner" verify --verbose "$apk" >/dev/null
          done
          arm64_apk="$(find "$out" -maxdepth 1 -type f -name '*arm64-v8a*.apk' | head -n 1)"
          universal_apk="$(find "$out" -maxdepth 1 -type f -name '*universal*.apk' | head -n 1)"
          test -n "$arm64_apk"
          test -n "$universal_apk"
          arm64_entries="$(unzip -Z1 "$arm64_apk")"
          universal_entries="$(unzip -Z1 "$universal_apk")"
          grep -Fq 'lib/arm64-v8a/' <<< "$arm64_entries"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Fq "lib/$abi/" <<< "$universal_entries" || { echo "::error::Universal APK missing $abi native libraries"; exit 1; }
          done
          echo 'APK ZIP integrity, signatures, and native ABI payloads verified.'

      - name: Upload all APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvmx-all-android-apks
          path: app/build/outputs/apk/standard/preview/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish all APKs in public GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mpvmx-preview-${{ github.sha }}
          name: mpvmx Preview ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/standard/preview/*.apk
          fail_on_unmatched_files: true
