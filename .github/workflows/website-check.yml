name: Validate mpvmx website

on:
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website-check.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website-check.yml"

permissions:
  contents: read

jobs:
  build:
    name: Check and build static website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate website configuration
        run: npm run validate

      - name: Build website
        run: npm run build
