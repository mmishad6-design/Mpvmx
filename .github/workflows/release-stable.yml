name: Build and publish mpvmx Stable APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mpvmx-stable-release
  cancel-in-progress: false

jobs:
  stable:
    name: Build, verify, and publish Stable APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Require and validate permanent release signing key
        env:
          MPVMX_KEYSTORE_BASE64: ${{ secrets.MPVMX_SIGNING_KEYSTORE_BASE64 }}
          MPVMX_STORE_PASSWORD: ${{ secrets.MPVMX_SIGNING_STORE_PASSWORD }}
          MPVMX_KEY_ALIAS: ${{ secrets.MPVMX_SIGNING_KEY_ALIAS }}
          MPVMX_KEY_PASSWORD: ${{ secrets.MPVMX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MPVMX_KEYSTORE_BASE64 MPVMX_STORE_PASSWORD MPVMX_KEY_ALIAS MPVMX_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required signing secret $name is missing. Stable release is blocked."
              exit 1
            fi
          done
          key_path="${RUNNER_TEMP}/mpvmx-release.p12"
          printf '%s' "$MPVMX_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          test -s "$key_path"
          keytool -list -keystore "$key_path" -storepass "$MPVMX_STORE_PASSWORD" -alias "$MPVMX_KEY_ALIAS" >/dev/null
          echo "MPVMX_SIGNING_STORE_FILE=$key_path" >> "$GITHUB_ENV"
          echo "MPVMX_SIGNING_STORE_PASSWORD=$MPVMX_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MPVMX_SIGNING_KEY_ALIAS=$MPVMX_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MPVMX_SIGNING_KEY_PASSWORD=$MPVMX_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Permanent release key is present and its alias/password validated."

      - name: Build split and universal Stable APKs
        run: ./gradlew assembleStandardRelease --stacktrace --no-daemon --max-workers=2

      - name: Build standalone ARM64 Stable APK
        run: |
          set -euo pipefail
          out='app/build/outputs/apk/standard/release'
          backup="${RUNNER_TEMP}/mpvmx-stable-split-apks"
          mkdir -p "$backup"
          cp "$out"/*.apk "$backup"/
          ./gradlew assembleStandardRelease -PtargetAbi=arm64-v8a --stacktrace --no-daemon --max-workers=2
          standalone="$out/app-standard-release.apk"
          test -s "$standalone"
          cp "$standalone" "$out/app-standard-arm64-v8a-standalone-stable.apk"
          rm "$standalone"
          cp "$backup"/*.apk "$out"/

      - name: Verify APKs, signatures, ABIs, and checksums
        shell: bash
        run: |
          set -euo pipefail
          out='app/build/outputs/apk/standard/release'
          echo 'Stable APK files generated:'
          find "$out" -maxdepth 1 -type f -name '*.apk' -printf '%f (%k KB)\n' | sort
          count="$(find "$out" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [ "$count" -lt 6 ]; then
            echo "::error::Expected 4 ABI APKs, 1 universal APK, and 1 standalone ARM64 APK; found $count."
            exit 1
          fi
          test -s "$out/app-standard-arm64-v8a-standalone-stable.apk" || { echo "::error::Standalone ARM64 APK is missing."; exit 1; }
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if ! find "$out" -maxdepth 1 -type f -name "*${abi}*.apk" | grep -q .; then
              echo "::error::Missing APK for $abi"
              exit 1
            fi
          done
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          test -x "$apksigner"
          for apk in "$out"/*.apk; do
            echo "Checking $(basename "$apk")"
            unzip -t "$apk" >/dev/null
            "$apksigner" verify --verbose "$apk" >/dev/null
          done
          universal_apk="$(find "$out" -maxdepth 1 -type f -name '*universal*.apk' | head -n 1)"
          test -n "$universal_apk"
          universal_entries="$(unzip -Z1 "$universal_apk")"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Fq "lib/$abi/" <<< "$universal_entries" || { echo "::error::Universal APK missing $abi native libraries"; exit 1; }
          done
          (cd "$out" && sha256sum *.apk > SHA256SUMS.txt)
          echo 'All APKs passed ZIP integrity and signature checks; universal ABI payloads verified.'

      - name: Upload Stable APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvmx-stable-3.0.2.2-apks
          path: app/build/outputs/apk/standard/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish public Stable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.2.2
          name: mpvmx 3.0.2.2 Stable
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/standard/release/*.apk
          fail_on_unmatched_files: true
